name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PACMAN_GITHUB_TOKEN || github.token }}
          games: pacman
          player_style: aggressive

      - name: Polish generated SVGs
        shell: pwsh
        run: |
          ./scripts/polish-pacman-svg.ps1 -Path dist/pacman-contribution-graph.svg -Theme Light
          ./scripts/polish-pacman-svg.ps1 -Path dist/pacman-contribution-graph-dark.svg -Theme Dark

      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
