name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Verify contribution access token
        shell: pwsh
        env:
          PACMAN_TOKEN: ${{ secrets.PACMAN_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PACMAN_TOKEN)) {
            throw "PACMAN_GITHUB_TOKEN is missing. Add a personal access token so the graph can read the full contribution calendar."
          }

      - name: Generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: 'Zhaibin-Cui'
          github_token: ${{ secrets.PACMAN_GITHUB_TOKEN }}
          games: pacman
          # player_style: aggressive

      - name: Polish generated SVGs
        shell: pwsh
        run: |
          ./scripts/polish-pacman-svg.ps1 -Path dist/pacman-contribution-graph.svg -Theme Light
          ./scripts/polish-pacman-svg.ps1 -Path dist/pacman-contribution-graph-dark.svg -Theme Dark

      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
