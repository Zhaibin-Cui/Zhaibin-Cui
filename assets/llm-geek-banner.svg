<svg width="960" height="210" viewBox="0 0 960 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Understanding language models from the inside</title>
  <desc id="desc">A minimal dark banner about investigating the internal mechanisms of language models.</desc>
  <defs>
    <linearGradient id="bg" x1="42" y1="0" x2="918" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#171127"/>
    </linearGradient>
    <linearGradient id="line" x1="216" y1="0" x2="744" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#22D3EE"/>
      <stop offset="0.7" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F9A8D4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 105) rotate(90) scale(150 360)">
      <stop stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748B" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="960" height="210" rx="22" fill="url(#bg)"/>
  <rect width="960" height="210" rx="22" fill="url(#glow)"/>
  <rect width="960" height="210" rx="22" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="208" rx="21" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="480" y="70" font-size="13" font-weight="650" letter-spacing="3.6" fill="#A78BFA">LANGUAGE MODELS · FROM THE INSIDE</text>
    <text x="480" y="116" font-size="32" font-weight="720" letter-spacing="-0.8" fill="#F8FAFC">How does a model become intelligent?</text>
    <text x="480" y="151" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#94A3B8">observe  ·  isolate  ·  probe  ·  explain</text>
  </g>

  <path d="M216 174H744" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="317" cy="174" r="3" fill="#22D3EE"/>
  <circle cx="480" cy="174" r="3" fill="#A78BFA"/>
  <circle cx="643" cy="174" r="3" fill="#F9A8D4"/>
</svg>
