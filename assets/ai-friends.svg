<svg width="960" height="220" viewBox="0 0 960 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cute AI friends banner</title>
  <desc id="desc">A cute pastel banner with small AI characters, stars, hearts, and code bubbles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4D7"/>
      <stop offset="0.46" stop-color="#E9F7FF"/>
      <stop offset="1" stop-color="#F5E8FF"/>
    </linearGradient>
    <linearGradient id="bot" x1="268" y1="42" x2="452" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFE9FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8BA6C6" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="220" rx="32" fill="url(#bg)"/>
  <circle cx="95" cy="62" r="8" fill="#FFD166"/>
  <circle cx="835" cy="55" r="10" fill="#FF9AC2"/>
  <circle cx="875" cy="152" r="7" fill="#7BDFF2"/>
  <circle cx="132" cy="160" r="6" fill="#C9F9C7"/>

  <path d="M62 112c18-16 36-16 54 0 18 16 36 16 54 0" stroke="#FFB4C8" stroke-width="10" stroke-linecap="round"/>
  <path d="M782 112c18-16 36-16 54 0 18 16 36 16 54 0" stroke="#B7E4FF" stroke-width="10" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="265" y="42" width="430" height="136" rx="34" fill="white" opacity="0.92"/>
    <rect x="292" y="65" width="154" height="90" rx="30" fill="url(#bot)" stroke="#6AC7FF" stroke-width="4"/>
    <circle cx="336" cy="108" r="13" fill="#243B53"/>
    <circle cx="402" cy="108" r="13" fill="#243B53"/>
    <path d="M348 132c13 11 29 11 42 0" stroke="#243B53" stroke-width="6" stroke-linecap="round"/>
    <path d="M369 65V40" stroke="#6AC7FF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="369" cy="35" r="9" fill="#FFD166"/>

    <rect x="492" y="68" width="156" height="84" rx="24" fill="#FFF7FB" stroke="#FF9AC2" stroke-width="4"/>
    <text x="570" y="104" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#6B4E71">AI friend</text>
    <text x="570" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8A6D91">coding snacks ✦</text>
  </g>

  <text x="480" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#6B7280">
    tiny bots, soft pixels, and one hungry Pac-Man
  </text>

  <path d="M211 59l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2 6-13z" fill="#FFD166"/>
  <path d="M737 62l5 11 12 2-9 8 2 12-10-6-11 6 2-12-9-8 12-2 6-11z" fill="#A7F3D0"/>
  <path d="M221 153c0-10 14-14 20-5 6-9 20-5 20 5 0 14-20 25-20 25s-20-11-20-25z" fill="#FF9AC2"/>
  <path d="M710 151c0-9 13-13 18-5 6-8 18-4 18 5 0 13-18 23-18 23s-18-10-18-23z" fill="#B197FC"/>
</svg>
